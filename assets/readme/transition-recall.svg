      <rect x="840" y="351" width="260" height="8" rx="4"/>
      <rect x="840" y="424" width="260" height="8" rx="4"/>
      <rect x="840" y="497" width="249.6" height="8" rx="4"/>
      <rect x="840" y="570" width="244.082" height="8" rx="4"/>
      <rect x="840" y="643" width="250.37" height="8" rx="4"/>
