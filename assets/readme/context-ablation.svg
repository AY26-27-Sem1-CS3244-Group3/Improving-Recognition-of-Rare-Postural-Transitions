<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Context and weighting on validation transition F1</title>
  <desc id="desc">Mean transition macro-F1 across the five classifiers with a weighting comparison. The current window scores 0.7080, weighting alone 0.7352, three windows 0.8422, and three windows with weighting 0.8515.</desc>
  <rect width="1200" height="560" rx="20" fill="#f5f8f7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#102b35">
    <text x="56" y="91" font-size="48" font-weight="700">Validation transition macro-F1</text>
    <text x="56" y="145" font-size="34" fill="#4c616b">Mean across five classifiers</text>

    <path d="M445 181v290 M587.5 181v290 M730 181v290 M872.5 181v290 M1015 181v290" stroke="#c5d2d5" stroke-width="2"/>
    <g font-size="39">
      <text x="56" y="230">Current only</text>
      <text x="56" y="302">Weighting only</text>
      <text x="56" y="374" font-weight="700">Three windows</text>
      <text x="56" y="446">Three + weighting</text>
    </g>
    <g>
      <rect x="445" y="198" width="403.56" height="36" rx="7" fill="#7b939f"/>
      <rect x="445" y="270" width="419.064" height="36" rx="7" fill="#a74e2d"/>
      <rect x="445" y="342" width="480.054" height="36" rx="7" fill="#175b86"/>
      <rect x="445" y="414" width="485.355" height="36" rx="7" fill="#175b86"/>
    </g>
    <g font-size="40" font-weight="700" font-variant-numeric="tabular-nums">
      <text x="1028" y="230">0.7080</text>
      <text x="1028" y="302">0.7352</text>
      <text x="1028" y="374">0.8422</text>
      <text x="1028" y="446">0.8515</text>
    </g>
    <g font-size="34" fill="#4c616b">
      <text x="445" y="518" text-anchor="middle">0</text>
      <text x="587.5" y="518" text-anchor="middle">0.25</text>
      <text x="730" y="518" text-anchor="middle">0.50</text>
      <text x="872.5" y="518" text-anchor="middle">0.75</text>
      <text x="1015" y="518" text-anchor="middle">1.00</text>
    </g>
  </g>
</svg>
